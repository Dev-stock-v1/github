<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>指數推演</title>
<style>:root{--bg:#f4f6f8;--card:#fff;--tx:#16202c;--mut:#5d6b7c;--line:#dde2e8;--up:#c4372d;--dn:#177a4a;--main:#d9730d;--gray:#6b7280;--alt:#1f6fb2;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0e131a;--card:#161d27;--tx:#e7ebf0;--mut:#93a0b0;--line:#273141;--up:#ff6b5e;--dn:#3fcf8e;--main:#f59e42;--gray:#aab3c0;--alt:#5db7ff}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans TC","PingFang TC",system-ui,sans-serif}main{max-width:560px;margin:auto;padding:12px 10px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 12px}h1{font-size:18px;margin:2px 0 6px}h2{font-size:15px;margin:0 0 4px}
.m{color:var(--mut);font-size:12px}.tabs{display:flex;gap:8px;margin:0 0 10px}.tabs button{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx)}.tabs button.on{background:var(--alt);color:#fff;border-color:var(--alt)}[hidden]{display:none!important}svg{width:100%;height:auto;display:block}.v b{font-size:17px}</style></head><body><main>

<div class="card"><h2>日K</h2><div class="m">推測波形　$nd</div>$cd</div>

<div class="card"><h2>5分K</h2><div class="m">推測波形　$n5</div>$c5</div>
